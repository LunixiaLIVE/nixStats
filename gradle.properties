org.gradle.jvmargs=-Xmx2G
org.gradle.java.home=C:/Users/Lunix/.jdks/openjdk-26

enabled_platforms=fabric,neoforge

# Minecraft
minecraft_version=26.1.2
# One jar covers every 26.x line below. The code differs between them only where Mojang renamed
# things, and those spots go through APIs that are identical on all of them (mixin field accessors,
# setScreenAndShow, setTooltipForNextFrame), so the compiled classes match on every line.
# To extend to a new line, re-verify the bytecode, then bump these three together
# (and rename the branch, e.g. multi_26.1-4).
mc_label=26.1-3
mc_range_fabric=>=26.1 <26.4-
mc_range_neoforge=[26.1,26.4)

neoforge_version=26.1.2.76

loader_version=0.19.3
fabric_version=0.153.0+26.1.2

# Mod
mod_version=1.4.2.2
maven_group=net.lunix
archives_base_name=nixstats
